<!doctype html>
<html lang="en">

    <head>

        <meta charset="utf-8" />
        <title>Error {{ error_status }} | Ashgard - ToDo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- App favicon -->
        <link rel="shortcut icon" href="{{ url_for('static', filename='assets/images/ashgard_favicon.png') }}">

        <!-- Bootstrap Css -->
        <link href="{{url_for('static', filename='/assets/css/bootstrap.min.css')}}" id="bootstrap-style" rel="stylesheet" type="text/css" />
        <!-- Icons Css -->
        <link href="{{url_for('static', filename='assets/css/icons.min.css')}}" rel="stylesheet" type="text/css" />
        <!-- App Css-->
        <link href="{{url_for('static', filename='assets/css/app.min.css')}}" id="app-style" rel="stylesheet" type="text/css" />

    </head>

    
    <body>

    <!-- <body data-layout="horizontal"> -->

    <div class="min-vh-100" style="background: url(static/assets/images/bg-2.png) top;">
        <div class="bg-overlay bg-light"></div>
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="text-center py-5 mt-5">
                        <img src="{{url_for('static', filename='assets/images/error.png')}}" width="150rem" alt="Error" class="mb-2">
                        <div class="position-relative">
                            <h1 class="error-title error-text mb-0">{{ error_status }}</h1>
                            <h4 class="error-subtitle text-uppercase mb-0">{{ error_msg }}</h4>
                            <p class="font-size-16 mx-auto text-muted w-50 mt-4">{{ error_desc }}</p>
                        </div>
                        <div class="mt-4 text-center">
                            <a class="btn btn-primary" href="{{url_for('project.projects')}}">Back to Projects page</a>
                        </div>
                    </div>
                </div>
                <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <!-- end container -->
    </div>
    <!-- end authentication section -->

    <!-- JAVASCRIPT -->
    <script src="{{url_for('static', filename='assets/libs/bootstrap/js/bootstrap.bundle.min.js')}} "></script>
    <script src="{{url_for('static', filename='assets/libs/metismenujs/metismenujs.min.js')}} "></script>
    <script src="{{url_for('static', filename='assets/libs/simplebar/simplebar.min.js')}} "></script>
    <script src="{{url_for('static', filename='assets/libs/eva-icons/eva.min.js')}} "></script>

    </body>

</html>
